<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Eisenhower Matrix</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070d19">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #070d19;
      --card-bg: #0f172a;
      --border-subtle: #1e293b;
      
      --p1-header: #fef08a;
      --p1-text: #713f12;
      --p1-border: #eab308;

      --p2-header: #fecdd3;
      --p2-text: #881337;
      --p2-border: #f43f5e;

      --p3-header: #cffafe;
      --p3-text: #164e63;
      --p3-border: #0ea5e9;

      --p4-header: #bbf7d0;
      --p4-text: #14532d;
      --p4-border: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0b1324;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      min-height: 46px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .brand i {
      color: #38bdf8;
      font-size: 1.1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 20px;
      background: #111c33;
      border: 1px solid #1e293b;
      color: #94a3b8;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .status-dot.synced { background: #22c55e; }
    .status-dot.syncing { background: #eab308; animation: blink 0.5s infinite; }
    .status-dot.error { background: #ef4444; }

    @keyframes blink { 50% { opacity: 0.2; } }

    .btn-icon {
      background: #111c33;
      color: #cbd5e1;
      border: 1px solid #1e293b;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-icon:active {
      transform: scale(0.92);
      background: #1e293b;
    }

    .matrix-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      min-height: 0;
      background: var(--bg-dark);
    }

    .quadrant {
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1.5px solid;
      background: var(--card-bg);
      min-height: 0;
      position: relative;
    }

    .quadrant.p1 { border-color: var(--p1-border); }
    .quadrant.p1 .quad-header { background: var(--p1-header); color: var(--p1-text); }

    .quadrant.p2 { border-color: var(--p2-border); }
    .quadrant.p2 .quad-header { background: var(--p2-header); color: var(--p2-text); }

    .quadrant.p3 { border-color: var(--p3-border); }
    .quadrant.p3 .quad-header { background: var(--p3-header); color: var(--p3-text); }

    .quadrant.p4 { border-color: var(--p4-border); }
    .quadrant.p4 .quad-header { background: var(--p4-header); color: var(--p4-text); }

    .quad-header {
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      user-select: none;
    }

    .quad-title {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .priority-badge {
      font-size: 0.72rem;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.15);
      font-weight: 800;
      flex-shrink: 0;
    }

    .quad-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .quad-tools button {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: inherit;
      display: flex;
      align-items: center;
    }

    .inline-add-bar {
      display: none;
      padding: 4px;
      background: #111c33;
      border-bottom: 1px solid #1e293b;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }

    .inline-add-bar.active { display: flex; }

    .inline-add-bar input {
      flex: 1;
      min-width: 0;
      background: #070d19;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
    }

    .inline-add-bar button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }

    .task-card {
      background: #152238;
      border: 1px solid #1e293b;
      padding: 5px 6px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: opacity 0.15s ease, transform 0.15s ease;
      position: relative;
    }

    .task-card.completing {
      opacity: 0;
      transform: scale(0.92);
    }

    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .task-checkbox {
      margin-top: 2px;
      cursor: pointer;
      accent-color: #38bdf8;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.76rem;
      line-height: 1.25;
      color: #f1f5f9;
      font-weight: 500;
      word-break: break-word;
      cursor: pointer;
    }

    .task-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.62rem;
      color: #94a3b8;
      margin-left: 21px;
    }

    .reminder-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .reminder-badge.overdue {
      background: #ef4444;
      color: #fff;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .form-group input, .form-group select, .form-group textarea {
      background: #070d19;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      outline: none;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.78rem;
    }

    .btn-secondary {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      cursor: pointer;
    }

    .history-item {
      background: #070d19;
      border: 1px solid #1e293b;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .history-item .hist-text {
      font-size: 0.75rem;
      text-decoration: line-through;
      color: #94a3b8;
      flex: 1;
    }

    .history-item .hist-meta {
      font-size: 0.62rem;
      color: #64748b;
    }

    body.widget-mode header {
      display: none !important;
    }
    body.widget-mode .matrix-grid {
      padding: 2px !important;
      gap: 3px !important;
    }
  </style>
</head>
<body>

  <header id="mainHeader">
    <div class="brand">
      <i class="fa-solid fa-shapes"></i>
      <span>My Eisenhower Matrix</span>
    </div>

    <div class="header-actions">
      <div class="sync-status" id="syncStatus" title="GitHub Status">
        <span class="status-dot" id="syncDot"></span>
        <span id="syncText">Sync</span>
      </div>

      <button class="btn-icon" id="btnPinWidget" title="Install App to Homescreen"><i class="fa-solid fa-arrow-down-to-square"></i></button>
      <button class="btn-icon" id="btnHistory" title="History"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button class="btn-icon" id="btnBackup" title="Backup & Restore"><i class="fa-solid fa-database"></i></button>
      <button class="btn-icon" id="btnSettings" title="GitHub Vault"><i class="fa-solid fa-gear"></i></button>
    </div>
  </header>

  <main class="matrix-grid">
    <div class="quadrant p1" data-quad="p1">
      <div class="quad-header">
        <div class="quad-title">
          <span class="priority-badge">P1</span>
          <span>Important & Urgent</span>
        </div>
        <div class="quad-tools">
          <button onclick="speakQuadrant('p1')" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
          <button onclick="toggleInlineAdd('p1')" title="Quick Add"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <div class="inline-add-bar" id="addBar-p1">
        <input type="text" id="input-p1" placeholder="Add P1 task..." onkeydown="handleInlineKey(event, 'p1')">
        <button onclick="submitInlineAdd('p1')">Add</button>
      </div>
      <div class="task-list" id="list-p1"></div>
    </div>

    <div class="quadrant p2" data-quad="p2">
      <div class="quad-header">
        <div class="quad-title">
          <span class="priority-badge">P2</span>
          <span>Important & Not Urgent</span>
        </div>
        <div class="quad-tools">
          <button onclick="speakQuadrant('p2')" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
          <button onclick="toggleInlineAdd('p2')" title="Quick Add"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <div class="inline-add-bar" id="addBar-p2">
        <input type="text" id="input-p2" placeholder="Add P2 task..." onkeydown="handleInlineKey(event, 'p2')">
        <button onclick="submitInlineAdd('p2')">Add</button>
      </div>
      <div class="task-list" id="list-p2"></div>
    </div>

    <div class="quadrant p3" data-quad="p3">
      <div class="quad-header">
        <div class="quad-title">
          <span class="priority-badge">P3</span>
          <span>Not Important & Urgent</span>
        </div>
        <div class="quad-tools">
          <button onclick="speakQuadrant('p3')" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
          <button onclick="toggleInlineAdd('p3')" title="Quick Add"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <div class="inline-add-bar" id="addBar-p3">
        <input type="text" id="input-p3" placeholder="Add P3 task..." onkeydown="handleInlineKey(event, 'p3')">
        <button onclick="submitInlineAdd('p3')">Add</button>
      </div>
      <div class="task-list" id="list-p3"></div>
    </div>

    <div class="quadrant p4" data-quad="p4">
      <div class="quad-header">
        <div class="quad-title">
          <span class="priority-badge">P4</span>
          <span>Not Important & Not Urgent</span>
        </div>
        <div class="quad-tools">
          <button onclick="speakQuadrant('p4')" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
          <button onclick="toggleInlineAdd('p4')" title="Quick Add"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <div class="inline-add-bar" id="addBar-p4">
        <input type="text" id="input-p4" placeholder="Add P4 task..." onkeydown="handleInlineKey(event, 'p4')">
        <button onclick="submitInlineAdd('p4')">Add</button>
      </div>
      <div class="task-list" id="list-p4"></div>
    </div>
  </main>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>GitHub Live Sync Vault</span>
        <button class="modal-close" onclick="closeModal('settingsModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="vaultAuthStep">
        <div class="form-group">
          <label>Master Password</label>
          <input type="password" id="vaultAuthPass" placeholder="Enter Shubham@144" autocomplete="off">
        </div>
        <button class="btn-primary" style="margin-top:8px;" onclick="verifyMasterPass()"><i class="fa-solid fa-unlock"></i> Unlock Vault</button>
      </div>

      <div id="vaultConfigStep" style="display:none; flex-direction:column; gap:8px;">
        <div class="form-group">
          <label>GitHub Personal Access Token (PAT)</label>
          <input type="password" id="vaultToken" placeholder="ghp_xxx" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Repository (Owner/Repo)</label>
          <input type="text" id="vaultRepo" value="TechIsInMyDNA/My-Eisenhower-Matrix">
        </div>
        <button class="btn-primary" onclick="saveVaultConfig()"><i class="fa-solid fa-floppy-disk"></i> Save & Connect Live</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="backupModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>Backup & Restore</span>
        <button class="modal-close" onclick="closeModal('backupModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p style="font-size:0.72rem; color:#94a3b8;">
        Full tasks and completed history export/import with 0 data loss.
      </p>
      <button class="btn-primary" onclick="exportBackup()"><i class="fa-solid fa-download"></i> Download Full Backup (.json)</button>
      <div style="border-top:1px solid #1e293b; margin: 3px 0;"></div>
      <div class="form-group">
        <label>Select Backup JSON File to Restore:</label>
        <input type="file" id="importFileInput" accept=".json">
      </div>
      <button class="btn-secondary" onclick="importBackup()"><i class="fa-solid fa-upload"></i> Restore from JSON</button>
    </div>
  </div>

  <div class="modal-overlay" id="reminderModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>Task & Reminder Alert</span>
        <button class="modal-close" onclick="closeModal('reminderModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>Task Content</label>
        <textarea id="editTaskText" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Quadrant</label>
        <select id="editTaskQuadrant">
          <option value="p1">P1 - Important & Urgent</option>
          <option value="p2">P2 - Important & Not Urgent</option>
          <option value="p3">P3 - Not Important & Urgent</option>
          <option value="p4">P4 - Not Important & Not Urgent</option>
        </select>
      </div>
      <div class="form-group">
        <label>Optional Reminder (Date & Time)</label>
        <input type="datetime-local" id="editTaskReminder">
      </div>
      <div style="display:flex; justify-content:space-between; gap:6px; margin-top:4px;">
        <button class="btn-secondary" style="background:#ef4444;" onclick="deleteCurrentTask()"><i class="fa-solid fa-trash"></i> Delete</button>
        <button class="btn-primary" onclick="saveTaskModal()"><i class="fa-solid fa-check"></i> Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="historyModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>Completed Tasks History</span>
        <button class="modal-close" onclick="closeModal('historyModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="historyListContainer" style="display:flex; flex-direction:column; gap:5px; max-height:55vh; overflow-y:auto;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
        <button class="btn-secondary" onclick="clearAllHistory()" style="background:#ef4444;">Clear All</button>
        <button class="btn-secondary" onclick="closeModal('historyModal')">Close</button>
      </div>
    </div>
  </div>

  <script>
    const MASTER_PASS = "Shubham@144";
    const GITHUB_REPO_DEFAULT = "TechIsInMyDNA/My-Eisenhower-Matrix";
    const DATA_FILE_PATH = "data.json";

    let state = {
      tasks: [],
      history: [],
      sha: null,
      activeTaskId: null,
      isPushing: false
    };

    if (new URLSearchParams(window.location.search).get('view') === 'widget') {
      document.body.classList.add('widget-mode');
    }

    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#070d19"/><rect x="40" y="40" width="200" height="200" rx="20" fill="#fef08a"/><rect x="272" y="40" width="200" height="200" rx="20" fill="#fecdd3"/><rect x="40" y="272" width="200" height="200" rx="20" fill="#cffafe"/><rect x="272" y="272" width="200" height="200" rx="20" fill="#bbf7d0"/></svg>`;
    const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg);

    const manifestData = {
      name: "My Eisenhower Matrix",
      short_name: "Eisenhower",
      start_url: "./index.html",
      scope: "./",
      display: "standalone",
      background_color: "#070d19",
      theme_color: "#070d19",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
        { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW note:', e));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const pinBtn = document.getElementById('btnPinWidget');
      if (pinBtn) pinBtn.style.color = '#38bdf8';
    });

    document.getElementById('btnPinWidget').onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') deferredPrompt = null;
      } else {
        alert("PWA ready! Chrome ke 3-dots menu par jaakar 'Install App' ya 'Add to Home screen' karein.");
      }
    };

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function loadLocal() {
      const localData = localStorage.getItem("sgm_eisenhower_data");
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          state.tasks = parsed.tasks || [];
          state.history = parsed.history || [];
        } catch(e) {}
      }
      renderMatrix();
    }

    function saveLocal() {
      localStorage.setItem("sgm_eisenhower_data", JSON.stringify({
        tasks: state.tasks,
        history: state.history
      }));
      renderMatrix();
    }

    function renderMatrix() {
      ['p1', 'p2', 'p3', 'p4'].forEach(quad => {
        const container = document.getElementById(`list-${quad}`);
        if (!container) return;
        container.innerHTML = "";

        const quadTasks = state.tasks.filter(t => t.quadrant === quad);

        quadTasks.forEach(task => {
          const card = document.createElement("div");
          card.className = "task-card";
          card.id = `card-${task.id}`;

          let reminderHtml = "";
          if (task.reminder) {
            const isOverdue = new Date(task.reminder) < new Date();
            const timeStr = new Date(task.reminder).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            reminderHtml = `<span class="reminder-badge ${isOverdue ? 'overdue' : ''}" onclick="openEditModal('${task.id}')">
              <i class="fa-regular fa-bell"></i> ${timeStr}
            </span>`;
          }

          card.innerHTML = `
            <div class="task-main">
              <input type="checkbox" class="task-checkbox" onchange="completeTask('${task.id}')">
              <span class="task-text" onclick="openEditModal('${task.id}')">${task.text}</span>
            </div>
            <div class="task-meta">
              <span>${task.createdAt || ''}</span>
              ${reminderHtml}
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function toggleInlineAdd(quad) {
      const bar = document.getElementById(`addBar-${quad}`);
      bar.classList.toggle('active');
      if (bar.classList.contains('active')) {
        document.getElementById(`input-${quad}`).focus();
      }
    }

    function handleInlineKey(e, quad) {
      if (e.key === "Enter") submitInlineAdd(quad);
    }

    function submitInlineAdd(quad) {
      const input = document.getElementById(`input-${quad}`);
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = now.toLocaleDateString([], {day:'2-digit', month:'short'}) + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

      state.tasks.unshift({
        id: "task_" + Date.now(),
        text: text,
        quadrant: quad,
        createdAt: timeStr,
        reminder: null,
        completed: false
      });

      input.value = "";
      saveLocal();
      fastInstantSync();
    }

    function completeTask(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.style.textDecoration = "line-through";
        card.classList.add("completing");
      }

      setTimeout(() => {
        const idx = state.tasks.findIndex(t => t.id === id);
        if (idx !== -1) {
          const task = state.tasks.splice(idx, 1)[0];
          task.completed = true;
          task.completedAt = new Date().toLocaleString();
          state.history.unshift(task);
          saveLocal();
          fastInstantSync();
        }
      }, 140);
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openEditModal(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      state.activeTaskId = id;
      document.getElementById('editTaskText').value = task.text;
      document.getElementById('editTaskQuadrant').value = task.quadrant;
      document.getElementById('editTaskReminder').value = task.reminder || "";
      openModal('reminderModal');
    }

    function saveTaskModal() {
      const task = state.tasks.find(t => t.id === state.activeTaskId);
      if (task) {
        task.text = document.getElementById('editTaskText').value.trim();
        task.quadrant = document.getElementById('editTaskQuadrant').value;
        task.reminder = document.getElementById('editTaskReminder').value || null;
        saveLocal();
        fastInstantSync();
      }
      closeModal('reminderModal');
    }

    function deleteCurrentTask() {
      state.tasks = state.tasks.filter(t => t.id !== state.activeTaskId);
      saveLocal();
      fastInstantSync();
      closeModal('reminderModal');
    }

    document.getElementById('btnHistory').onclick = () => {
      const container = document.getElementById('historyListContainer');
      container.innerHTML = "";
      if (state.history.length === 0) {
        container.innerHTML = "<div style='color:#94a3b8; text-align:center; padding:10px; font-size:0.75rem;'>No completed tasks</div>";
      } else {
        state.history.forEach(item => {
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <div style="flex:1;">
              <div class="hist-text">${item.text}</div>
              <div class="hist-meta">Completed: ${item.completedAt || ''} | ${item.quadrant.toUpperCase()}</div>
            </div>
            <button class="btn-secondary" onclick="restoreTask('${item.id}')" title="Restore"><i class="fa-solid fa-rotate-left"></i></button>
          `;
          container.appendChild(div);
        });
      }
      openModal('historyModal');
    };

    function restoreTask(id) {
      const idx = state.history.findIndex(t => t.id === id);
      if (idx !== -1) {
        const item = state.history.splice(idx, 1)[0];
        item.completed = false;
        state.tasks.push(item);
        saveLocal();
        fastInstantSync();
        document.getElementById('btnHistory').click();
      }
    }

    function clearAllHistory() {
      if (confirm("Clear all completed task history?")) {
        state.history = [];
        saveLocal();
        fastInstantSync();
        closeModal('historyModal');
      }
    }

    document.getElementById('btnBackup').onclick = () => openModal('backupModal');

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        tasks: state.tasks,
        history: state.history,
        exportedAt: new Date().toISOString()
      }, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `Eisenhower_Backup_${Date.now()}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importBackup() {
      const fileInput = document.getElementById('importFileInput');
      if (!fileInput.files.length) {
        alert("Please select a JSON file");
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data.tasks)) {
            state.tasks = data.tasks;
            state.history = data.history || [];
            saveLocal();
            fastInstantSync();
            alert("All tasks and history restored successfully!");
            closeModal('backupModal');
          } else {
            alert("Invalid backup file format");
          }
        } catch (err) {
          alert("Error parsing file: " + err.message);
        }
      };
      reader.readAsText(fileInput.files[0]);
    }

    function speakQuadrant(quad) {
      const list = state.tasks.filter(t => t.quadrant === quad);
      if (list.length === 0) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("No tasks in " + quad.toUpperCase()));
        return;
      }
      const textToSpeak = quad.toUpperCase() + ": " + list.map((t, idx) => `${idx + 1}. ${t.text}`).join(". ");
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.rate = 1.0;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    document.getElementById('btnSettings').onclick = () => {
      document.getElementById('vaultAuthStep').style.display = "block";
      document.getElementById('vaultConfigStep').style.display = "none";
      document.getElementById('vaultAuthPass').value = "";
      openModal('settingsModal');
    };

    function verifyMasterPass() {
      const pass = document.getElementById('vaultAuthPass').value;
      if (pass !== MASTER_PASS) {
        alert("Incorrect Master Password");
        return;
      }
      document.getElementById('vaultAuthStep').style.display = "none";
      document.getElementById('vaultConfigStep').style.display = "flex";
      
      const savedToken = localStorage.getItem("gh_pat_vault");
      if (savedToken) {
        document.getElementById('vaultToken').value = atob(savedToken);
      }
      document.getElementById('vaultRepo').value = localStorage.getItem("gh_repo_vault") || GITHUB_REPO_DEFAULT;
    }

    function saveVaultConfig() {
      const token = document.getElementById('vaultToken').value.trim();
      const repo = document.getElementById('vaultRepo').value.trim() || GITHUB_REPO_DEFAULT;

      if (token) localStorage.setItem("gh_pat_vault", btoa(token));
      localStorage.setItem("gh_repo_vault", repo);

      alert("GitHub Vault unlocked & configuration saved!");
      closeModal('settingsModal');
      syncFromGitHub(true);
    }

    function getGitHubToken() {
      const encoded = localStorage.getItem("gh_pat_vault");
      return encoded ? atob(encoded) : null;
    }

    function getGitHubRepo() {
      return localStorage.getItem("gh_repo_vault") || GITHUB_REPO_DEFAULT;
    }

    // --- ULTRA-FAST DIRECT LIVE SYNC ENGINE ---
    async function syncFromGitHub(force = false) {
      if (state.isPushing && !force) return;

      const token = getGitHubToken();
      const repo = getGitHubRepo();
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');

      if (!token) {
        if (dot && text) {
          dot.className = "status-dot";
          text.innerText = "No Token";
        }
        return;
      }

      try {
        // Cache-buster timestamp ensures zero GitHub stale cache lag
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${DATA_FILE_PATH}?_t=${Date.now()}`, {
          cache: "no-store",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (res.status === 200) {
          const json = await res.json();
          state.sha = json.sha;
          const content = JSON.parse(decodeURIComponent(escape(atob(json.content))));
          if (content.tasks) {
            // Check if server data is newer
            const localStr = JSON.stringify({ tasks: state.tasks, history: state.history });
            const remoteStr = JSON.stringify({ tasks: content.tasks, history: content.history || [] });
            if (localStr !== remoteStr) {
              state.tasks = content.tasks;
              state.history = content.history || [];
              saveLocal();
            }
          }
          if (dot && text) {
            dot.className = "status-dot synced";
            text.innerText = "Synced";
          }
        } else if (res.status === 404) {
          await pushToGitHub();
        }
      } catch (err) {
        if (dot && text) {
          dot.className = "status-dot error";
          text.innerText = "Offline";
        }
      }
    }

    async function pushToGitHub() {
      const token = getGitHubToken();
      const repo = getGitHubRepo();
      if (!token) return;

      state.isPushing = true;
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');
      if (dot && text) {
        dot.className = "status-dot syncing";
        text.innerText = "Syncing...";
      }

      const payload = {
        tasks: state.tasks,
        history: state.history,
        updatedAt: new Date().toISOString()
      };

      const bodyData = {
        message: "Fast-sync via My Eisenhower Matrix",
        content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))))
      };
      if (state.sha) bodyData.sha = state.sha;

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${DATA_FILE_PATH}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          const resJson = await res.json();
          state.sha = resJson.content.sha;
          if (dot && text) {
            dot.className = "status-dot synced";
            text.innerText = "Synced";
          }
        } else if (res.status === 409) {
          // Conflict handle: Fetch sha and retry instantly
          await syncFromGitHub(true);
        } else {
          if (dot && text) {
            dot.className = "status-dot error";
            text.innerText = "Error";
          }
        }
      } catch (e) {
        if (dot && text) {
          dot.className = "status-dot error";
          text.innerText = "Fail";
        }
      } finally {
        state.isPushing = false;
      }
    }

    // 150ms Instant Action Sync
    let instantTimer = null;
    function fastInstantSync() {
      clearTimeout(instantTimer);
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');
      if (dot && text) {
        dot.className = "status-dot syncing";
        text.innerText = "Saving...";
      }
      instantTimer = setTimeout(() => {
        pushToGitHub();
      }, 150);
    }

    // Fast Event Listeners
    window.addEventListener('focus', () => syncFromGitHub(true));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncFromGitHub(true);
    });
    window.addEventListener('online', () => syncFromGitHub(true));

    // High frequency 4-second live poll
    setInterval(() => {
      if (navigator.onLine && document.visibilityState === 'visible') {
        syncFromGitHub();
      }
    }, 4000);

    // Reminder Checker (Every 30s)
    setInterval(() => {
      const now = new Date();
      state.tasks.forEach(t => {
        if (t.reminder && !t.reminded) {
          const remTime = new Date(t.reminder);
          if (now >= remTime) {
            t.reminded = true;
            playChime();
            if ("Notification" in window && Notification.permission === "granted") {
              new Notification("Eisenhower Reminder: " + t.quadrant.toUpperCase(), {
                body: t.text,
                icon: "https://cdn-icons-png.flaticon.com/512/906/906334.png"
              });
            } else {
              alert(`⏰ Reminder [${t.quadrant.toUpperCase()}]:\n${t.text}`);
            }
            saveLocal();
          }
        }
      });
    }, 30000);

    window.addEventListener('DOMContentLoaded', () => {
      loadLocal();
      syncFromGitHub(true);
    });
  </script>
</body>
